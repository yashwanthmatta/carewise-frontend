name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check sw.js

      - name: Check app shell cache version
        run: |
          test "$(grep -o 'carewise-product-[0-9][0-9]*' index.html | sort -u | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'carewise-product-[0-9][0-9]*' sw.js | sort -u | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'carewise-product-[0-9][0-9]*' index.html | sort -u)" = "$(grep -o 'carewise-product-[0-9][0-9]*' sw.js | sort -u)"

      - name: Changed cached files come with a new cache version
        run: node scripts/check_cache_version.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Frontend smoke test
        run: node scripts/smoke_frontend.mjs

      - name: Marketing claims check
        run: node scripts/claims_audit.mjs

      - name: Report reading accuracy test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/dev/null 2>&1 &
          sleep 2
          node scripts/eval/run-eval.mjs

      - name: Content-Security-Policy does not break the site
        run: |
          python3 scripts/serve_with_headers.py 4174 &
          sleep 2
          node scripts/eval/csp-check.mjs
          # Same checks with no response headers, as the live host serves it (policy from <meta>).
          CAREWISE_CSP_URL=http://localhost:4173/ node scripts/eval/csp-check.mjs
          python3 scripts/csp_meta.py --check

      - name: Safety cases (emergency symptoms, critical values)
        run: node scripts/eval/safety-cases.mjs

      - name: Correcting a misread photo number updates everything
        run: node scripts/eval/ocr-resolution.mjs

      - name: Test names in headings never take another test's value
        run: node scripts/eval/heading-values.mjs

      - name: Repeated results keep the concerning value; misread numbers are not read
        run: node scripts/eval/repeat-and-misread-values.mjs

      - name: Help chat answers match the website
        run: node scripts/eval/help-answers.mjs

      - name: Share-packet PDF (labs, summary, top 3 questions)
        run: node scripts/eval/share-packet-pdf.mjs

      - name: Clinic self-pay prices and visit summary sections (doctor demo)
        run: node scripts/eval/visit-settings-demo.mjs

      - name: Sign-in card (tabs, Enter key, show password, two-step code, reset, log out)
        run: node scripts/eval/sign-in.mjs

      - name: Randomized report check (standard and hard reports)
        run: |
          node scripts/eval/stress.mjs --text 5000 --seed 101
          node scripts/eval/stress.mjs --text 5000 --seed 202 --hard

      - name: Read-aloud says lab values with the same meaning (decimals, units, ranges)
        run: node scripts/eval/speech-cases.mjs
