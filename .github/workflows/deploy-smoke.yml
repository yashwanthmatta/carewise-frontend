name: Live Frontend Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Live FollowThrough Health frontend URL
        required: true
        default: https://carewise-frontend.onrender.com

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run live frontend smoke test
        run: node scripts/smoke_frontend.mjs --base-url "${{ inputs.base_url }}"

      - name: Live rules version and HTTPS redirect
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          # Follow redirects (www may forward to the main domain) and report what was found.
          final=$(curl -sSL -o /dev/null -w '%{url_effective}' "$BASE_URL/")
          echo "::notice::$BASE_URL/ ends at $final"
          version=$(curl -fsSL "$BASE_URL/script.js" | grep -o 'EXPLANATION_RULES_VERSION = "[^"]*"' | head -1)
          if [ -z "$version" ]; then echo "::error::No rules version found in the live script"; exit 1; fi
          echo "::notice::Live $version"
          host=${BASE_URL#https://}; host=${host%%/*}
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$host/")
          target=$(curl -s -o /dev/null -w '%{redirect_url}' "http://$host/")
          echo "::notice::http://$host/ answered $code -> $target"
          case "$code" in 301|302|307|308) ;; *) echo "::error::Plain http does not redirect"; exit 1;; esac
          case "$target" in https://*) ;; *) echo "::error::Plain http redirects to $target, not https"; exit 1;; esac
