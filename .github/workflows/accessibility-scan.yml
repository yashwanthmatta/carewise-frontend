name: Accessibility Scan

# Nightly axe-core scan (WCAG 2.0/2.1/2.2 A and AA) of every app screen and static page on main,
# on a phone and a desktop size. Fails on serious or critical violations; the full list of
# findings, including moderate and minor ones, is kept as a run artifact for 30 days.
# An automated scan finds only part of what matters; it does not replace screen-reader,
# keyboard-only and zoom testing by a person.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: accessibility-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # Pinned: Playwright 1.56.1 cannot install a browser on Ubuntu 26.04 (ubuntu-latest since 29 Oct 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install a browser and axe-core
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.14.0
          # Retried: on 11 Nov 2026 the runner could not resolve the Ubuntu package mirror for ~10
          # minutes and the nightly scan failed before scanning anything.
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && break
            [ "$attempt" = 3 ] && exit 1
            echo "Browser install failed (attempt $attempt of 3); retrying in 30 seconds"
            sleep 30
          done
      - name: Scan every screen and page
        run: |
          python3 -m http.server 4173 >/dev/null 2>&1 &
          sleep 2
          AXE_PATH=node_modules/axe-core/axe.min.js A11Y_JSON=a11y-findings.json node scripts/eval/a11y-scan.mjs
      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-findings
          path: a11y-findings.json
          if-no-files-found: ignore
          retention-days: 30
